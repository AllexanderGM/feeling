spring.application.name=${NAME:name-app}
spring.config.import=optional:file:.env
spring.profiles.active=${ENV:development}
spring.main.allow-circular-references=true
server.tomcat.use-relative-redirects=true
# SERVER
server.port=${PORT_BACK}
cors.allowed.origins=${URL_FRONT}
# LOGGING
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.level.com.feeling.config.logging.RequestLoggingFilter=DEBUG
logging.level.com.feeling.packages.auth.domain.services.AuthService=INFO
# ADMIN USER CONFIGURATION
admin.username=${ADMIN_USERNAME}
admin.password=${ADMIN_PASSWORD}
# DATABASE
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true
spring.jpa.properties.hibernate.id.new_generator_mappings=false
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.connection.autocommit=false
spring.jpa.properties.hibernate.current_session_context_class=thread
spring.datasource.hikari.connection-init-sql=SET NAMES utf8mb4 COLLATE utf8mb4_unicode_ci
spring.jpa.properties.hibernate.connection.characterEncoding=UTF-8
spring.jpa.properties.hibernate.connection.CharSet=UTF-8
spring.jpa.properties.hibernate.connection.useUnicode=true
# JWT - NUNCA usar valores por defecto en producción
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:1800000}
jwt.refresh.expiration=${JWT_REFRESH_EXPIRATION:2592000000}
# ENCRYPTION
encryption.algorithm=${ALGORITHM}
encryption.key=${KEY}
encryption.iv=${IV}
# MAIL
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL}
spring.mail.password=${MAILPASS}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# TEMPLATES
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
# HTTP ENCODING
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
# MULTIPART
# Límite por archivo individual (máximo 5MB)
spring.servlet.multipart.max-file-size=5MB
# Límite total de la petición: 5 imágenes × ~3.5MB (con compresión) + JSON (~10KB) + overhead
# Configurado a 20MB para casos reales donde la compresión puede variar
spring.servlet.multipart.max-request-size=20MB
spring.servlet.multipart.enabled=true
spring.servlet.multipart.file-size-threshold=2KB
# Tomcat max request size (debe ser >= max-request-size)
server.tomcat.max-http-form-post-size=20MB
# CACHE
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=1000,expireAfterWrite=15m,recordStats
# STRIPE
stripe.secret.key=${STRIPE_SECRET_KEY:}
# PAYMENTS
feeling.payments.gateway=${PAYMENTS_GATEWAY:simulation}
feeling.payments.currency=${PAYMENTS_CURRENCY:COP}
feeling.payments.redirect-url=${PAYMENTS_REDIRECT_URL:}
wompi.public-key=${WOMPI_PUBLIC_KEY:}
wompi.private-key=${WOMPI_PRIVATE_KEY:}
wompi.integrity-secret=${WOMPI_INTEGRITY_SECRET:}
wompi.api-base=${WOMPI_API_BASE:https://sandbox.wompi.co/v1}
wompi.redirect-url=${WOMPI_REDIRECT_URL:${PAYMENTS_REDIRECT_URL:}}
# BOOKINGS
feeling.bookings.max-future-days=${BOOKINGS_MAX_FUTURE_DAYS:365}
# STORAGE
storage.type=${STORAGE_TYPE:minio}
# SPRING WEB
spring.web.resources.add-mappings=true
# SWAGGER/OPENAPI DOCUMENTATION
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.default-produces-media-type=application/json
springdoc.default-consumes-media-type=application/json
springdoc.writer-with-default-pretty-printer=true
