# LOGGING
logging.level.root=INFO
logging.level.com.feeling=INFO
logging.level.com.feeling.config.logging.LoggingAspect=WARN
logging.level.org.springframework.web=INFO
# SQL logging (solo en caso necesario - cambiar a DEBUG para depuración)
logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.use_sql_comments=false
# Base de datos MySQL (local)
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&useSSL=true&serverTimezone=UTC&allowPublicKeyRetrieval=true
# Configuracion de almacenamiento MINIO (solo desarrollo)
storage.type=minio
minio.url=http://minio:${MINIO_PORT}
minio.public-url=http://localhost:${MINIO_PORT}
minio.access-key=${MINIO_ROOT_USER}
minio.secret-key=${MINIO_ROOT_PASSWORD}
minio.bucket=${MINIO_BUCKET}
# Configuracion de la aplicacion
app.admin.email=${ADMIN_EMAIL:admin@feeling.com}
feeling.payments.gateway=${PAYMENTS_GATEWAY:simulation}
feeling.payments.currency=${PAYMENTS_CURRENCY:COP}
feeling.bookings.max-future-days=${BOOKINGS_MAX_FUTURE_DAYS:365}
